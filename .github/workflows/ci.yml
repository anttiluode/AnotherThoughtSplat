name: ci

on:
  push:
    branches: [main, "gate/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev]
      - run: pytest
      - name: Gate 0 quick receipt
        run: python experiments/gate0_ring_world.py --quick --out results/gate0-ci --no-ply
      - name: Gate 1 quick receipt
        run: python experiments/gate1_local_spectroscopy.py --quick --out results/gate1-ci --no-ply
      - name: Gate 2 receipt
        run: python experiments/gate2_polysemantic_world.py --out results/gate2-ci --no-ply
      - name: Gate 3 receipt
        run: python experiments/gate3_reversible_counterfactual.py --out results/gate3-ci --no-ply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-receipts-py${{ matrix.python-version }}
          path: |
            results/gate0-ci/gate0_receipt.json
            results/gate1-ci/gate1_receipt.json
            results/gate2-ci/gate2_receipt.json
            results/gate3-ci/gate3_receipt.json
          if-no-files-found: warn
